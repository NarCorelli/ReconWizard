<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recon Report - {{ target }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .header { background: #343a40; color: white; padding: 15px; }
        .section { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        pre { background: #eee; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Recon Report: {{ target }}</h1>
        <p>Scan Time: {{ timestamp }}</p>
    </div>
    <div class="container mt-4">
        {% for section, data in sections.items() %}
        <div class="section">
            <h3>{{ section }}</h3>
            <pre>{{ data | tojson(indent=2) }}</pre>
        </div>
        {% endfor %}

        <div class="section">
            <h3>Open Ports Chart</h3>
            <canvas id="portsChart"></canvas>
        </div>
    </div>

    <script>
        const portsData = {{ sections["Open Ports"] | tojson }};
        const labels = Object.keys(portsData);
        const values = Object.values(portsData).map(v => v ? 1 : 0);

        new Chart(document.getElementById('portsChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Open (1) / Closed (0)',
                    data: values,
                    backgroundColor: values.map(v => v ? 'rgba(255, 99, 132, 0.7)' : 'rgba(54, 162, 235, 0.7)')
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });
    </script>
</body>
</html>
